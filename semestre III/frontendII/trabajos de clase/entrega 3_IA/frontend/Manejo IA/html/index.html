<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Institucional Académico — Acceso</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/Style.css" rel="stylesheet">
</head>
<body>

  <!-- ══════════════════════════ ACCESO ══════════════════════════ -->
  <div id="loginPage" class="d-flex align-items-center justify-content-center">
    <div class="card p-2" id="loginCard">
      <div class="card-body p-5">

        <!-- Ícono + título -->
        <div class="text-center mb-4">
          <i class="bi bi-building login-icon"></i>
          <h4 class="fw-bold mt-2 mb-1">Sistema Institucional</h4>
          <p class="text-muted small mb-0">Ingresa tus credenciales para continuar</p>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-pills nav-fill mb-4" id="authTabs">
          <li class="nav-item">
            <button class="nav-link active" id="tabLogin" onclick="showTab('login')">
              <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="tabRegister" onclick="showTab('register')">
              <i class="bi bi-person-plus me-1"></i>Registrarse
            </button>
          </li>
        </ul>

        <!-- Alerta -->
        <div class="alert py-2 small d-none" id="loginErr"></div>

        <!-- ── FORMULARIO LOGIN ── -->
        <div id="formLogin">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="lEmail"
                     placeholder="correo@ejemplo.com" autocomplete="email">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="lPass"
                     placeholder="••••••••" autocomplete="current-password">
              <button class="btn btn-outline-secondary" type="button"
                      onclick="togglePass('lPass', this.querySelector('i'))">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <button class="btn btn-primary w-100 fw-semibold py-2" id="btnLogin" onclick="login()">
            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
          </button>
          <p class="text-center mt-3 small text-muted mb-0">
            Acceso admin: <code>admin@sia.edu.co</code> / <code>Admin1234@</code>
          </p>
        </div>

        <!-- ── FORMULARIO REGISTRO ── -->
        <div id="formRegister" style="display:none">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Nombre completo <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="rNombre" placeholder="Tu nombre completo">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Correo electrónico <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="rCorreo" placeholder="correo@ejemplo.com">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Teléfono</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-telephone"></i></span>
              <input type="text" class="form-control" id="rTelefono" placeholder="3001234567">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Contraseña <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="rPass" placeholder="Mín. 8 chars, 1 mayús, 1 núm, 1 especial">
              <button class="btn btn-outline-secondary" type="button"
                      onclick="togglePass('rPass', this.querySelector('i'))">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">Confirmar contraseña <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control" id="rPass2" placeholder="Repite la contraseña">
            </div>
          </div>
          <button class="btn btn-success w-100 fw-semibold py-2" id="btnRegister" onclick="register()">
            <i class="bi bi-person-check me-2"></i>Crear cuenta
          </button>
          <p class="text-center mt-3 small text-muted mb-0">
            Al registrarte se asignará el rol de <strong>Cliente</strong> automáticamente.
          </p>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/login.js"></script>

</body>
</html>
