<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crud con Local Storage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-7">
        <h1 class="text-center">Crud Pedidos</h1>
      </div>
      <div class="col-7">
        <form class="p-4 border rounded bg-body-tertiary">
          <div class="mb-3">
            <label class="form-label">Cliente</label>
            <input type="text" class="cliente form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Producto</label>
            <select class="producto form-select">
              <option selected value="">Seleccione un producto</option>
              <option value="Pizza">Pizza</option>
              <option value="Hamburguesa">Hamburguesa</option>
              <option value="Lasagna">Lasagna</option>
              <option value="Pasta">Pasta</option>
              <option value="Perro">Perro</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" min="20000" class="precio form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Imagen</label>
            <input type="url" class="imagen form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Observacion</label>
            <input type="text" class="observacion form-control">
          </div>
          <button type="button" class=" btn-guardar btn btn-primary">Guardar pedido</button>
          <button type="button" class="d-none btn-actualizar btn btn-success">Actualizar pedido</button>
        </form>
      </div>
      <div class="col-7 mt-4">
        <input type="text" class="buscador form-control" placeholder="Buscar por cliente, producto o precio...">
      </div>
      <div class="col-7">
        <table class="table mt-5">
          <thead>
            <tr>
              <th>#</th>
              <th>Cliente</th>
              <th>Producto</th>
              <th>Precio</th>
              <th>Imagen</th>
              <th>Descripcion</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>

</html>
